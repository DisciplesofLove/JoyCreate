[package]
name = "store_registry_stylus"
version = "0.1.0"
edition = "2021"

[dependencies]
stylus-sdk = "=0.9.0"
alloy-primitives = { version = "=0.8.20", default-features = false }
alloy-sol-types = { version = "=0.8.20", default-features = false }
# Pin: ruint 1.18.0 fails const-eval on rustc 1.95.0; 1.16.0 is known-good.
ruint = { version = "=1.16.0", default-features = false }

[lib]
crate-type = ["lib", "cdylib"]

[features]
export-abi = []

[profile.release]
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
lto = true
